name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # npm install, not npm ci: no package-lock.json is committed yet
      - run: npm install
      - run: npm run build -- --base=./

      # android/ is git-ignored and generated here
      - run: npx cap add android

      - name: Version 1.2.0 (build 3), native plugins, permissions, icon
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 3/; s/versionName "[^"]*"/versionName "1.2.0"/' android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application android:enableOnBackInvokedCallback="true"/' $M
          cp android-native/*.java android/app/src/main/java/com/synapse/moodys/
          cp -r android-res/. android/app/src/main/res/
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "enableOnBackInvokedCallback\|VIBRATE\|POST_NOTIFICATIONS" $M
          ls android/app/src/main/java/com/synapse/moodys

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: moodys-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
